  <div id="root" data-composition-id="09-papel" data-width="1920" data-height="1080" data-duration="6.943">

    <div class="clip" data-start="0" data-duration="6.943" data-track-index="2">

        <svg class="papel-mask-svg" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
          <path

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var DURATION = 6.443;

      // ================= Scene 1 (0.0–1.8s) — mask self-draws =================
      var drawTargets = [
        document.getElementById("papel-mask-outline"),
        document.querySelector("#papel-eye-l .papel-mask-eye"),
        document.querySelector("#papel-eye-r .papel-mask-eye"),
        document.getElementById("papel-mask-mouth"),
      ];
      drawTargets.forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      // face outline
      tl.to(drawTargets[0], { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.15);
      // eyes together, starting ~75% into the outline draw
      tl.to(drawTargets[1], { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.525);
      tl.to(drawTargets[2], { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.525);
      // mouth, starting ~75% into the eyes draw
      tl.to(drawTargets[3], { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.7875);

      // tiny settle pop once the pen lifts
      var maskWrap = document.querySelector(".papel-mask-wrap");
      tl.fromTo(
        maskWrap,
        { scale: 1 },
        { scale: 1.04, duration: 0.15, ease: "power1.out", yoyo: true, repeat: 1 },
        1.1
      );

      // single subtle internal blink during the Scene 2 hold (svg-icon-enrichment)
      var eyeL = document.getElementById("papel-eye-l");
      var eyeR = document.getElementById("papel-eye-r");
      var blinkState = { s: 1 };
      function applyBlink() {
        var s = blinkState.s;
        eyeL.setAttribute("transform", "translate(78 95) scale(1 " + s + ") translate(-78 -95)");
        eyeR.setAttribute("transform", "translate(122 95) scale(1 " + s + ") translate(-122 -95)");
      }
      applyBlink();
      tl.to(
        blinkState,
        { s: 0.12, duration: 0.15, ease: "power1.inOut", yoyo: true, repeat: 1, onUpdate: applyBlink },
        3.3
      );

      // ambient "holofote" breathing glow — subtle, finite, whole-frame
      var spotlight = document.getElementById("papel-spotlight");
      var spotState = { p: 0 };
      tl.to(
        spotState,
        {
          p: Math.PI * 2 * 2,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            spotlight.style.opacity = String(0.55 + Math.sin(spotState.p) * 0.08);
          },
        },
        0
      );

      // ================= Scene 2 (1.8–4.1s) — per-word reveal, long settle =================
      var words = document.querySelectorAll("#papel-line-open .papel-word");
      var WORD_START = 1.8;
      var WORD_STAGGER = 0.12;
      words.forEach(function (w, i) {
        tl.fromTo(
          w,
          { opacity: 0, y: 16, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power2.out" },
          WORD_START + i * WORD_STAGGER
        );
      });

      // ================= Scene 3 (4.1–6.443s) — flash word-swap, keyword glow, hold =================
      var lineOpen = document.getElementById("papel-line-open");
      var lineClose = document.getElementById("papel-line-close");

      // opening line hard-clears (snap-out, not a lingering fade)
      tl.fromTo(
        lineOpen,
        { opacity: 1, scale: 1 },
        { opacity: 0, scale: 0.96, duration: 0.15, ease: "power1.in" },
        4.1
      );

      // closing line flash-in (scale+blur slam)
      tl.fromTo(
        lineClose,
        { opacity: 0, scale: 1.4, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        4.12
      );

      // "bem" keyword glow — single-word attack/sustain/release envelope (asr-keyword-glow)
      var bemEl = document.getElementById("papel-keyword-bem");
      var BEM_START = 4.57;
      var BEM_END = 4.77;
      var ATTACK = 0.15;
      var RELEASE = 0.35;
      var REST_LEVEL = 0.3;
      var MAX_BLUR = 22;
      var MAX_SCALE_BOOST = 0.08;
      function bemEnvelope(t) {
        if (t < BEM_START) return 0;
        if (t < BEM_END) return Math.min((t - BEM_START) / ATTACK, 1);
        var releaseEnd = BEM_END + RELEASE;
        if (t < releaseEnd) return 1 - ((t - BEM_END) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      var bemDriver = { t: 0 };
      tl.to(
        bemDriver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var env = bemEnvelope(bemDriver.t);
            bemEl.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(1) + "px rgba(232,93,38," + (0.55 * env + 0.15).toFixed(2) + ")";
            bemEl.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(3) + ")";
          },
        },
        0
      );

      window.__timelines["09-papel"] = tl;
    })();
  </script>
