  tl.to("#rl11-stand-path", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.15);

  tl.to("#rl11-left-armpan", { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 0.6375);
  tl.to("#rl11-right-armpan", { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 0.8475);

  tl.to("#rl11-left-tile-drop", { scaleY: 1, scaleX: 1, duration: 0.22, ease: "back.out(1.6)" }, 2.10);
  tl.to("#rl11-beam-group", { rotation: -7, duration: 0.4, ease: "power2.out" }, 2.10);

  // =========================================================
  // Scene 3 (3.3-4.9s) — "desejar pouco" falls onto the right pan;
  // right side settles, becomes dominant, gains a soft glow

    "#rl11-right-tile-drop",

  tl.to("#rl11-right-tile-drop", { scaleY: 1, scaleX: 1, duration: 0.22, ease: "back.out(1.6)" }, 3.80);

  (function () {
    var glow = document.getElementById("rl11-glow");
    var phase = { p: 0 };
    var BLOOM_END = 3.85 + 0.55;
    var IDLE_DUR = 8.683 - BLOOM_END;
    var PEAK = 0.30, AMP_O = 0.02, AMP_S = 0.012;
    tl.to(
      phase,
      {
        p: Math.PI * 2 * 1.6,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function () {
          var s = Math.sin(phase.p);
          glow.style.opacity = String(PEAK + s * AMP_O);
          glow.style.transform = "scale(" + (1 + s * AMP_S) + ")";
        },
      },
      BLOOM_END

  // =========================================================
