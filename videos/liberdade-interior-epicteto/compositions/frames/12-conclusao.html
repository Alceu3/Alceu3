  <script src="gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 — per-word reveal, cream, long settle ----
      var s1 = [
        "fr12-w1-1",
        "fr12-w1-2",
        "fr12-w1-3",
        "fr12-w1-4",
        "fr12-w1-5",
        "fr12-w1-6",
        "fr12-w1-7",
        "fr12-w1-8",
      ];
      s1.forEach(function (id, i) {
        tl.fromTo(
          "#" + id,
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.1 + i * 0.16,
        );
      });
      // holds static ~1.72–2.8s ("settle longo")

      // ---- Scene 2 — flash word-swap hard cut (clip boundary), punctuated by a quick flash ----
      tl.fromTo(
        "#root .fr12-flash",
        { opacity: 0 },
        { opacity: 0.26, duration: 0.06, ease: "none" },
        2.8,
      );
      tl.to("#root .fr12-flash", { opacity: 0, duration: 0.22, ease: "power1.out" }, 2.86);

      // asr-keyword-glow (karaoke variant): "sem se quebrar" activate on an attack/sustain/release
      // envelope over hand-authored windows, driven by ONE linear driver — never one tween per word.
      var GLOW_TIMINGS = {
        "fr12-w2-4": { start: 3.0, end: 3.25 },
        "fr12-w2-5": { start: 3.25, end: 3.45 },
        "fr12-w2-6": { start: 3.45, end: 4.0 }, // final word of the clause sustains longest
      };
      var ATTACK_DUR = 0.18,
        RELEASE = 0.3,
        REST_LEVEL = 0.12,
        MAX_BLUR = 34,
        MAX_SCALE_BOOST = 0.16;
      var REST_RGB = { r: 240, g: 236, b: 229 }; // cream
      var ACTIVE_RGB = { r: 232, g: 93, b: 38 }; // fire-orange

      function envelope(t, start, end) {
        if (t < start) return 0;
        if (t < end) return Math.min((t - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (t < releaseEnd) return 1 - ((t - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      function lerpChannel(a, b, k) {
        return Math.round(a + (b - a) * k);
      }

      var glowEls = Object.keys(GLOW_TIMINGS).map(function (id) {
        return document.getElementById(id);
      });
      var glowDriver = { t: 2.8 };
      tl.to(
        glowDriver,
        {
          t: 4.5,
          duration: 1.7,
          ease: "none", // linear — any other ease warps the per-word envelope
          onUpdate: function () {
            glowEls.forEach(function (el) {
              var timing = GLOW_TIMINGS[el.id];
              var env = envelope(glowDriver.t, timing.start, timing.end);
              el.style.textShadow = "0 0 " + MAX_BLUR * env + "px rgba(232,93,38," + env + ")";
              el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
              el.style.color =
                "rgb(" +
                lerpChannel(REST_RGB.r, ACTIVE_RGB.r, env) +
                "," +
                lerpChannel(REST_RGB.g, ACTIVE_RGB.g, env) +
                "," +
                lerpChannel(REST_RGB.b, ACTIVE_RGB.b, env) +
                ")";
            });
          },
        },
        2.8,
      );
      // lock the emphasis clause fire-orange once the release completes — a clean held state,
      // dwelling well over 1s before the scene-3 cut at 6.2s.
      tl.set(glowEls, { color: "#e85d26", textShadow: "none", transform: "scale(1)" }, 4.5);

      // ---- Scene 3 — recap settles to support size; new line per-word reveal below ----
      tl.fromTo(
        "#fr12-recap",
        { opacity: 0, scale: 1.28, y: -6 },
        { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "power2.out" },
        6.2,
      );
      var s3 = [
        "fr12-w3-1",
        "fr12-w3-2",
        "fr12-w3-3",
        "fr12-w3-4",
        "fr12-w3-5",
        "fr12-w3-6",
        "fr12-w3-7",
      ];
      s3.forEach(function (id, i) {
        tl.fromTo(
          "#" + id,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          6.5 + i * 0.16,
        );
      });
      // holds static ~7.86–9.0s

      // ---- Scene 4 — hard cut to final card (clip boundary), flash pulse, restrained settle,
      // per-word assembly, then the TRUE EXIT: a still hold with only a subtle jitter ----
      tl.fromTo(
        "#root .fr12-flash",
        { opacity: 0 },
        { opacity: 0.3, duration: 0.06, ease: "none" },
        9.0,
      );
      tl.to("#root .fr12-flash", { opacity: 0, duration: 0.24, ease: "power1.out" }, 9.06);

      tl.fromTo(
        "#fr12-line-a",
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power2.out" },
        9.0,
      );

      var sb = ["fr12-wb-1", "fr12-wb-2", "fr12-wb-3"];
      sb.forEach(function (id, i) {
        tl.fromTo(
          "#" + id,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          9.35 + i * 0.35,
        );
      });
      // last word ("sabedoria.") settles at 10.5s

      // subtle jitter only, across the final hold — no other movement, this is the video's real exit
      var jitter = { p: 0 };
      tl.to(
        jitter,
        {
          p: Math.PI * 2 * 3,
          duration: 12.48 - 10.5,
          ease: "none",
          onUpdate: function () {
            var dx = Math.sin(jitter.p) * 1.4;
            var dy = Math.cos(jitter.p * 1.3) * 1.0;
            var el = document.getElementById("fr12-final-stack");
            el.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
          },
        },
        10.5,
      );

      window.__timelines["12-conclusao"] = tl;
    })();
  </script>
